<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 44" width="46" height="44">
  <!-- Hilarious squawking Deshi Murgi (rooster) -->
  <ellipse cx="22" cy="24" rx="16" ry="12" fill="#ea580c" stroke="#000000" stroke-width="2.5"/>
  <!-- Head & Comb -->
  <circle cx="34" cy="14" r="8" fill="#ea580c" stroke="#000000" stroke-width="2"/>
  <path d="M 32 6 Q 36 2 38 8 Q 42 4 40 10" fill="#dc2626" stroke="#000000" stroke-width="1.5"/>
  <!-- Big googly panicked eye -->
  <circle cx="35" cy="13" r="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="36" cy="13" r="1.5" fill="#000000"/>
  <!-- Beak open in squawk -->
  <polygon points="40,14 46,16 40,18" fill="#facc15" stroke="#000000" stroke-width="1.5"/>
  <!-- Flapping wing -->
  <path d="M 14 18 Q 6 10 12 26 Z" fill="#c2410c" stroke="#000000" stroke-width="2"/>
</svg>