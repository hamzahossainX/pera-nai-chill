<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 50" width="32" height="50">
  <!-- Smartphone body -->
  <rect x="2" y="2" width="28" height="46" rx="6" fill="#0f172a" stroke="#000000" stroke-width="2.5"/>
  <!-- Screen glass glow -->
  <rect x="5" y="6" width="22" height="34" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Broken cracked screen slashes (Dhaka Snatcher classic) -->
  <path d="M 8 10 L 16 22 L 23 18 M 16 22 L 12 36 M 16 22 L 24 28" fill="none" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top speaker pill -->
  <rect x="12" y="3.5" width="8" height="1.5" rx="0.75" fill="#64748b"/>
  <!-- Home indicator line -->
  <rect x="11" y="44" width="10" height="2" rx="1" fill="#475569"/>
</svg>